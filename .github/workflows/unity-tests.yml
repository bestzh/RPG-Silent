name: Unity validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  editmode:
    name: Unity EditMode
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check license configuration
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Configure UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in Actions secrets. See RPG-Silent/Docs/UnityValidation.md.'
            exit 1
          fi
      - name: Checkout project and LFS content
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Install verified GameCI CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/game-ci"
          archive="$RUNNER_TEMP/game-ci.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          printf '%s  %s\n' '1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/game-ci"
      - name: Run first-party EditMode tests
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          "$RUNNER_TEMP/game-ci/game-ci" test --docker --engine=unity RPG-Silent \
            --testPlatforms=editmode --coverageEnabled=false \
            --customParameters="-assemblyNames RPGSilent.Tests.Editor" \
            --artifactsPath=Logs/CI --dockerShmSize=1025m
      - name: Require non-empty passing results
        run: python3 RPG-Silent/Tools/Validation/check_test_results.py RPG-Silent/Logs/CI
      - name: Preserve test results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-validation-${{ github.sha }}
          path: RPG-Silent/Logs/CI
          if-no-files-found: warn
          retention-days: 14
